spring:
  application:
    name: chiflete-backend
  main:
    # Los virtual threads son daemon: mantiene viva la JVM (research R4).
    keep-alive: true
  threads:
    virtual:
      enabled: true
  http:
    clients:
      # Una sola llamada al proveedor por petición: como mucho ~4 s, antes del límite de 5 s del
      # frontend (FR-022a, research R5).
      connect-timeout: 1s
      read-timeout: 3s

server:
  error:
    # Las respuestas de error no revelan detalles internos (Principio IV, FR-023).
    include-stacktrace: never
    include-message: never
    include-exception: false
    include-binding-errors: never
    include-path: never

logging:
  structured:
    format:
      console: ecs

management:
  endpoints:
    web:
      exposure:
        include: health,metrics

chiflete:
  open-meteo:
    geocoding-url: ${OPEN_METEO_GEOCODING_URL:https://geocoding-api.open-meteo.com}
    forecast-url: ${OPEN_METEO_FORECAST_URL:https://api.open-meteo.com}
